<!DOCTYPE html>
<html>
<head>
    <title>Todo List App</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 400px; margin: auto; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #eee; margin-bottom: 5px; display: flex; justify-content: space-between; cursor: pointer; }
        .completed { text-decoration: line-through; color: gray; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h2>My Todo List</h2>
    <input type="text" id="taskInp" placeholder="Enter new task...">
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <script>
        function addTask() {
            let taskValue = document.getElementById("taskInp").value;
            if (taskValue === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");
            
            // Task ka text ek span me
            let span = document.createElement("span");
            span.innerText = taskValue;
            
            // Click karne par completed mark ho (strike-through)
            span.onclick = function() {
                this.classList.toggle("completed");
            };

            // Delete button
            let dltBtn = document.createElement("button");
            dltBtn.innerText = "Delete";
            dltBtn.onclick = function() {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(dltBtn);
            
            document.getElementById("taskList").appendChild(li);
            document.getElementById("taskInp").value = ""; // Input clear karne ke liye
        }
    </script>
</body>
</html>
